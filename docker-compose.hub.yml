services:
  backend:
    image: trandangkhoaa/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env
    networks:
      - mern-network

  frontend:
    image: trandangkhoaa/mern-frontend:2.0
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://mern-backend:5000
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
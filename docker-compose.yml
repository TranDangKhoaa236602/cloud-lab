services:
  backend:
    build:
      context: ./mern-demo
      dockerfile: server/Dockerfile
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./mern-demo/.env
    networks:
      - mern-network

  frontend:
    build:
      context: ./mern-demo/client
    container_name: mern-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://mern-backend:5000
    depends_on:
      - backend
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridgegit status